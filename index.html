<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f6f5f1">
<title></title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect x='1' y='1' width='16' height='16' rx='2.5' fill='%23fffefb' stroke='%231b1d20' stroke-width='2'/%3E%3Crect x='6.5' y='6.5' width='5' height='5' fill='%231b1d20'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/font.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="wordmark" href="#puzzles">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1" y="1" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M6.5 2v14M11.5 2v14M2 6.5h14M2 11.5h14" stroke="currentColor" stroke-width="1" opacity=".45"/>
        <rect x="6.5" y="6.5" width="5" height="5" fill="currentColor"/>
      </svg>
      <span class="wordmark-name"></span>
    </a>
    <nav class="modes">
      <a data-mode="puzzles" href="#puzzles"></a>
      <a data-mode="solve" href="#solve"></a>
      <a data-mode="learn" href="#learn"></a>
      <a data-mode="analyse" href="#analyse"></a>
    </nav>
    <span class="bar-spacer"></span>
    <button id="keys-button" class="button text icon" type="button" popovertarget="keys">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1.5" y="4.5" width="17" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 8h1M8 8h1M11 8h1M14 8h1M5 11h1M14 11h1M8 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="settings-button" class="button text icon" type="button" popovertarget="settings">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 6h8M15 6h2M3 14h2M9 14h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="13" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="7" cy="14" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button id="new-puzzle" class="button text" type="button"><span class="wide-only" aria-hidden="true"></span><span class="narrow-only" aria-hidden="true"></span></button>
  </header>
  <main id="view" class="view"></main>
</div>

<div id="keys" class="keys" popover></div>
<div id="settings" class="keys settings" popover></div>
<div id="tip" class="tip" popover="manual" role="tooltip"></div>

<dialog id="puzzle-dialog" class="dialog" aria-labelledby="puzzle-dialog-title">
  <form method="dialog">
    <h2 id="puzzle-dialog-title"></h2>
    <label for="puzzle-input" class="meta"></label>
    <textarea id="puzzle-input" rows="3" spellcheck="false" autocomplete="off"
      placeholder="..5......9.8.3.....12..536.6.3.....2.3...8.1.....8.9.186..49.....9.1.4......6.."></textarea>
    <div class="row">
      <span id="puzzle-count" class="faint" aria-live="polite"></span>
      <span class="row">
        <button class="button text" value="cancel" formnovalidate></button>
        <button class="button primary" value="open"></button>
      </span>
    </div>
  </form>
</dialog>
</body>
</html>
